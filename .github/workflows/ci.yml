name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Every experiment is its own uv project (Python versions differ, so no workspace).
      - run: |
          for project in */pyproject.toml; do
            dir=$(dirname "$project")
            echo "::group::$dir"
            (cd "$dir" && uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run pytest)
            echo "::endgroup::"
          done
